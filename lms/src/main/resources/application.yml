server:
  port: 8089

spring:
  application:
    name: lms

  # Primary and ONLY database for LMS business entities
  datasource:
    url: jdbc:mysql://localhost:3306/lms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# Auth Platform Client Configuration (SSO & Resource Server)
auth:
  client:
    server-url: http://localhost:8080
    secret: ${JWT_SECRET:my-local-development-secret-key-at-least-32-bytes}
    issuer: auth-demo
    permit-all:
      - /public/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /actuator/**

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] [%X{tenantId}] %-5level %logger{36} - %msg%n"
  level:
    sol.auth: INFO
    com.sol.lms: DEBUG