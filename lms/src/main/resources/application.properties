spring.application.name=lms
server.port=8089

# Database Configuration (LMS Business DB only - ZERO connection to auth-db)
spring.datasource.url=jdbc:mysql://localhost:3306/lms_mpstme_nm_m?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Central Identity & SSO Client Configuration (via auth-client-starter)
auth.client.enabled=true
auth.client.server-url=http://localhost:8080
auth.client.secret=my-local-development-secret-key-at-least-32-bytes
auth.client.issuer=auth-demo
auth.client.permit-all=/public/**,/swagger-ui/**,/v3/api-docs/**,/actuator/**

# Campus & School Context
campusCode=MUM01
school=MPSTME-NM-M

# Logging
logging.level.com.nmims.lms=INFO
logging.level.sol.auth.client=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
