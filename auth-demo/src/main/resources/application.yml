spring:
  application:
    name: auth-demo
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

auth:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-to-a-32-byte-minimum-value}
    issuer: auth-demo
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 604800
  security:
    max-failed-login-attempts: 5
    lockout-duration-minutes: 30

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] [%X{tenantId}] %-5level %logger{36} - %msg%n"
  level:
    sol.auth: INFO
